name: Orange Telegram bot checks
on:
  push:
    paths: ['orange-telegram-bot/**', '.github/workflows/orange-bot-ci.yml']
  pull_request:
    paths: ['orange-telegram-bot/**', '.github/workflows/orange-bot-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orange-telegram-bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orange-telegram-bot/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -f dockerfile .
